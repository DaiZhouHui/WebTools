<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>小鹤双拼 · 韵母键位盲打练习</title>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.0/dist/index.js">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --primary: #4a90d9;
      --primary-dark: #357abd;
      --success: #4caf84;
      --error: #e97e7e;
      --text: #1e3a5f;
      --text-light: #5a7a9a;
      --border: #cbdbe9;
      --radius: 12px;
      --transition: 0.2s ease;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Droid Sans Mono', monospace;
      --sidebar-width: 175px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #ffffff;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 10px 10px 185px;
      user-select: none;
      -webkit-user-select: none;
      zoom: 1.1;
      transition: padding-left 0.3s ease;
      font-weight: 400;
      position: relative;
    }

    body.sidebar-collapsed {
      padding-left: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 48px;
      margin-bottom: 30px;
      transition: margin-left 0.3s ease;
    }

    .top-bar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: var(--sidebar-width);
      background: #ffffff;
      padding: 18px 12px 120px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      overflow-y: auto;
      z-index: 100;
      border-right: 1px solid var(--border);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    body.sidebar-collapsed .top-bar {
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .top-bar .title {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .title-icon {
      font-size: 1.8em;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      border-radius: 8px;
      transition: background 0.2s;
      color: var(--primary);
    }

    .title-icon:hover {
      background: #f0f6fd;
    }

    .title-text {
      font-weight: 800;
      font-size: 1.1em;
      color: var(--primary);
      white-space: nowrap;
    }

    .stage-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .stage-btn {
      padding: 7px 18px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.7em;
      font-weight: 400;
      transition: all var(--transition);
      white-space: nowrap;
      color: var(--text-light);
      text-align: left;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f0f6fd;
    }

    .stage-btn.completed {
      border-color: var(--border);
      color: var(--text-light);
      background: #fff;
    }

    .stage-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .sidebar-toggle-fixed {
      display: none;
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 110;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 1.5em;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .sidebar-toggle-fixed:hover {
      background: #f0f6fd;
    }

    body.sidebar-collapsed .sidebar-toggle-fixed {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-header {
      position: fixed;
      top: 0;
      left: var(--sidebar-width);
      right: 0;
      background: #ffffff;
      padding: 1px 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid #eef2f7;
      z-index: 90;
      transition: left 0.3s ease, padding 0.3s ease;
    }

    body.sidebar-collapsed .top-header {
      left: 0;
      padding: 1px 100px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-label {
      font-size: 0.8em;
      color: var(--text-light);
      font-weight: 400;
      white-space: nowrap;
    }

    .nav-btn-icon {
      background: none;
      border: none;
      font-size: 1em;
      cursor: pointer;
      color: #b0b0b0;
      padding: 4px 8px;
      border-radius: 12px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 400;
    }

    .nav-btn-icon:hover {
      background: #f0f0f0;
      color: #666;
    }

    .nav-btn-icon:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: transparent;
    }

    .controls-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ctrl-btn {
      padding: 4px 8px;
      border-radius: 16px;
      border: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      font-size: 1em;
      font-weight: 400;
      transition: all var(--transition);
      color: #b0b0b0;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ctrl-btn:hover {
      background: #f0f0f0;
      color: #888;
    }

    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: transparent;
      color: #ccc;
    }

    .ctrl-btn.active-toggle {
      color: #7a9fc4;
      background: #f0f4fa;
      border-color: #d0ddec;
    }

    .practice-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 10px 100px;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #ffffff;
    }

    .word-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 2px;
      align-items: center;
    }

    .word-tile {
      background: #f8fafc;
      border: 2px solid #e9eef3;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      min-width: 60px;
      flex: 0 1 auto;
      transition: all var(--transition);
      cursor: pointer;
      font-size: 0.95em;
    }

    .word-tile.current {
      border-color: var(--primary);
      background: #eef5fc;
      box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.2);
      transform: scale(1.02);
    }

    .word-tile.completed {
      border-color: var(--success);
      background: #eefaf3;
      opacity: 0.8;
    }

    .word-tile.error-flash {
      border-color: var(--error);
      background: #fff5f5;
    }

    .word-tile .zh {
      font-weight: 400;
      color: var(--text);
    }

    .word-tile .sp-hint {
      font-family: var(--font-mono);
      font-size: 0.7em;
      color: var(--text-light);
      margin-top: 2px;
    }

    .sp-hint.hidden {
      opacity: 0;
    }

    .flow-text {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      font-size: 2.2em;
      font-weight: 400;
      line-height: 1.4;
      color: #757575;
    }

    .flow-word {
      padding: 4px 6px;
      border-radius: 8px;
      position: relative;
      transition: all 0.2s;
    }

    .flow-word.current {
      border-bottom: 3px solid #0a6bf9;
      border-top: 1px solid #ddd;
      font-weight: 400;
    }

    .flow-word.completed-correct {
      background: #e6f7e6;
      color: #2d6a2d;
    }

    .flow-word.completed-error {
      background: #fff8e1;
      color: #8a6d14;
    }

    .flow-word.current-error {
      background: #ffeaea;
      color: #8b1a1a;
    }

    .io-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .input-display {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .char-slot {
      width: 30px;
      height: 36px;
      border-bottom: 3px solid #dde4ed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 1.4em;
      font-weight: 400;
      transition: all var(--transition);
      border-radius: 4px 4px 0 0;
    }

    .char-slot.filled-correct {
      border-bottom-color: var(--success);
      color: var(--success);
      background: #f0faf5;
    }

    .char-slot.filled-incorrect {
      border-bottom-color: var(--error);
      color: var(--error);
      animation: shake 0.3s;
    }

    .char-slot.current-slot {
      border-bottom-color: var(--primary);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        border-bottom-color: var(--primary);
      }

      50% {
        border-bottom-color: #7ab8f5;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    .stats-row {
      display: flex;
      gap: 10px;
      font-size: 0.7em;
      color: var(--text-light);
      font-weight: 400;
    }

    .progress-bar-wrap {
      background: #e9eef3;
      border-radius: 4px;
      height: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a90d9, #6db3f2);
      border-radius: 4px;
      transition: width 0.4s;
    }

    .keyboard-container {
      background: #ffffff;
      border-radius: 16px;
      padding: 8px 6px 8px 36px;
      box-shadow: none;
      overflow-x: auto;
      border: 1px solid #ffffff;
    }

    .keyboard-container svg {
      width: 100%;
      max-width: 720px;
      height: auto;
      display: block;
      margin: 0 auto;
      min-width: 600px;
    }

    .speed-stats {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
      padding: 0 20px;
      gap: 15px;
      font-size: 0.8em;
      color: var(--text-light);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 200;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 24px 28px;
      max-width: 650px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      color: var(--primary);
      font-weight: 400;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.8em;
      cursor: pointer;
      color: var(--text-light);
    }

    .custom-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      border-radius: 18px;
      border: 2px solid var(--border);
      font-size: 0.85em;
      font-weight: 400;
    }

    .add-btn {
      padding: 8px 14px;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 400;
      font-size: 0.85em;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    .custom-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 100px;
      overflow-y: auto;
    }

    .custom-tag {
      padding: 4px 10px;
      background: #eef3fc;
      border-radius: 14px;
      font-size: 0.8em;
      cursor: pointer;
      border: 1px solid #d2e2f5;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 400;
    }

    .custom-tag .remove-tag {
      cursor: pointer;
      color: #c0392b;
      font-weight: 400;
      margin-left: 2px;
    }

    .article-section {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .article-section textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: 16px;
      border: 2px solid var(--border);
      font-size: 0.85em;
      min-height: 80px;
      font-weight: 400;
    }

    .vocab-manager {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .vocab-manager input,
    .vocab-manager select {
      flex: 1;
      min-width: 130px;
      padding: 7px 10px;
      border-radius: 16px;
      border: 2px solid var(--border);
      font-size: 0.85em;
      font-weight: 400;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 400;
      font-size: 0.85em;
      z-index: 999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.success {
      background: #c2ea9a;
      color: #2d6a2d;
    }

    .toast.error {
      background: #fdd;
      color: #8b1a1a;
    }

    .toast.info {
      background: #dde8f8;
      color: #1e3a5f;
    }
  </style>
</head>

<body>
  <button class="sidebar-toggle-fixed" id="sidebarToggleFixed" title="展开侧边栏">🦉</button>

  <div class="top-bar" id="topBar">
    <div class="title">
      <button class="title-icon" id="titleIcon" title="收起侧边栏">🦉</button>
      <span class="title-text">小鹤双拼</span>
    </div>
    <div class="stage-selector" id="stageSelector"></div>
  </div>

  <div class="top-header" id="topHeader">
    <div class="card-header-left">
      <button class="nav-btn-icon" id="btnPrevStage" title="上一课">◀</button>
      <div class="stage-label" id="stageLabel">阶段1 · 韵母ai ei</div>
      <button class="nav-btn-icon" id="btnNextStage" title="下一课">▶</button>
    </div>
    <div class="controls-row" id="mainControls">
      <button class="ctrl-btn" id="btnHint" title="提示开关">💡</button>
      <button class="ctrl-btn" id="btnReset" title="重置进度">↺</button>
      <button class="ctrl-btn" id="btnShuffle" title="打乱顺序">⇄</button>
      <button class="ctrl-btn" id="btnSettings" title="设置">⚙️</button>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚙️ 设置</h2><button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="controls-row"><button class="ctrl-btn" id="btnClearCustom">🗑️ 清空自定义</button></div>
        <div class="custom-panel">
          <strong style="color:var(--primary);">📝 快速添加词汇</strong>
          <div class="input-row">
            <input type="text" id="customWordInput" placeholder="输入中文词汇，自动转双拼">
            <button class="add-btn" id="btnAddCustom">➕ 添加</button>
          </div>
          <div class="custom-list" id="customList"></div>
          <div class="article-section">
            <strong>📋 批量导入（自动识别文章/词组）</strong>
            <textarea id="batchInput" placeholder="输入文章或空格分隔的词汇..."></textarea>
            <button class="add-btn" id="btnBatchAdd">📥 批量添加</button>
          </div>
          <div class="article-section">
            <strong>💾 词库管理</strong>
            <div class="vocab-manager">
              <input type="text" id="vocabNameInput" placeholder="词库名称">
              <button class="add-btn" id="btnSaveVocab">保存</button>
            </div>
            <div class="vocab-manager">
              <select id="vocabSelect">
                <option value="">-- 加载词库 --</option>
              </select>
              <button class="add-btn" id="btnLoadVocab">加载</button>
              <button class="add-btn" id="btnDeleteVocab" style="background:#e97e7e;">删除</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="practice-card" id="practiceCard">
      <div class="word-grid" id="wordGrid"></div>
      <div class="io-area">
        <div class="input-display" id="inputDisplay"></div>
        <div class="stats-row">
          <span>✅ <span id="correctCount">0</span></span>
          <span>❌ <span id="errorCount">0</span></span>
          <span>🎯 <span id="accuracy">0%</span></span>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
      </div>
    </div>

    <div class="keyboard-container" id="keyboardContainer"></div>
    <div class="speed-stats">
      <span>🚀 速度 <span id="speedValue">0</span> KPM</span>
      <span>⏱️ 用时 <span id="timerValue">00:00</span></span>
    </div>
    <div class="toast" id="toast"></div>
  </div>

      function loadState() {

          state.completedStages = state.completedStages.filter(id => STAGES.some(st => st.id === id));

      function renderKeyboard() {
        const yunmuLabels = {
          'q': 'iu', 'w': 'ei', 'e': 'e', 'r': 'uan', 't': 'ue/ve', 'y': 'un', 'u': 'u/sh', 'i': 'i/ch', 'o': 'uo/o', 'p': 'ie',

          'z': 'ou', 'x': 'ia/ua', 'c': 'ao', 'v': 'ui/v/ch', 'b': 'in', 'n': 'iao', 'm': 'ian'
        };
        const rows = [
          ['`', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'backspace'],
          ['tab', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']', '\\'],
          ['capslock', 'a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'", 'enter'],
          ['shift-left', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', 'shift-right'],
          ['ctrl', 'win', 'alt', 'space', 'alt', 'ctrl']
        ];

        let svg = '<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg"><style>.kb-k{fill:#f7f9fb;stroke:#c5cdd5;stroke-width:1;rx:5}.kb-k.key-highlight{fill:#d6e6ff;stroke:#4a90d9;stroke-width:2.5}.kb-t{font-family:Roboto,sans-serif;font-size:9px;fill:#757575;text-anchor:middle;font-weight:400}.kb-tl{font-family:Roboto,sans-serif;font-size:20px;fill:#757575;text-anchor:start;font-weight:400}.kb-ty{font-family:Roboto,sans-serif;font-size:12px;fill:#757575;text-anchor:end;font-weight:400}.key-highlight .kb-tl,.key-highlight .kb-ty{fill:#ffffff}</style>';

        let y = 10;
        rows.forEach((row, ri) => {
          let x = 10;
          const rh = ri === 4 ? 36 : 42;
          row.forEach((k, idx) => {
            let w = 1;
            if (k === 'backspace') w = 1.6;
            else if (k === 'tab') w = 1.6;
            else if (k === 'capslock') w = 1.9;
            else if (k === 'enter') w = 1.7;
            else if (k === 'shift-left' || k === 'shift-right') w = (k === 'shift-right' ? 2.1 : 2.5);
            else if (k === 'space') {
              if (ri === 4) {
                const fixedWidthSoFar = row.slice(0, idx).reduce((sum, key) => {
                  if (key === 'space') return sum;
                  const wKey = 1;
                  return sum + (44 * wKey + (wKey - 1) * 4) + 4;
                }, 0);
                const remaining = 720 - 20 - fixedWidthSoFar - (row.slice(idx + 1).length * (44 + 4));
                w = (remaining + 4) / 48;
              } else {
                w = 5.5;
              }
            }
            else if (k === 'control' || k === 'option-left' || k === 'fn') w = 1.4;
            else if (k === 'option-right') w = 1.2;

            let pw = 44 * w + (w - 1) * 4;
            svg += `<rect id="kb-${k}" class="kb-k" x="${x}" y="${y}" width="${pw}" height="${rh}" rx="5"/>`;
            let ly = y + rh / 2 + 4;
            const displayText = (k === 'ctrl') ? 'Ctrl' : (k === 'win') ? 'Win' : (k === 'alt') ? 'Alt' : (k === 'space') ? '' : k;
            if (k === 'backspace') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">⌫</text>`;
            else if (k === 'tab') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Tab</text>`;
            else if (k === 'capslock') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">⇪</text>`;
            else if (k === 'enter') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Enter</text>`;
            else if (k === 'shift-left' || k === 'shift-right') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Shift</text>`;
            else if (k === 'space') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">空格</text>`;
            else if (k === 'ctrl') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Ctrl</text>`;
            else if (k === 'win') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Win</text>`;
            else if (k === 'alt') svg += `<text class="kb-t" x="${x + pw / 2}" y="${ly}">Alt</text>`;
            else if (k.length === 1 && /[a-z]/.test(k)) {
              svg += `<text class="kb-tl" x="${x + 6}" y="${y + 21}">${k.toUpperCase()}</text>`;
              if (yunmuLabels[k]) {
                const parts = yunmuLabels[k].split('/');
                if (parts.length === 1) {
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 6}">${parts[0]}</text>`;
                } else if (parts.length === 2) {
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 14}">${parts[0]}</text>`;
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 3}">${parts[1]}</text>`;
                } else if (parts.length === 3) {
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 20}">${parts[0]}</text>`;
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 11}">${parts[1]}</text>`;
                  svg += `<text class="kb-ty" x="${x + pw - 5}" y="${y + rh - 2}">${parts[2]}</text>`;
                }
              }
            } else if (k.length === 1 && /[0-9]/.test(k)) svg += `<text class="kb-tl" x="${x + pw / 2}" y="${ly - 2}">${k}</text>`;
            else svg += `<text class="kb-tl" x="${x + pw / 2}" y="${ly - 2}">${displayText}</text>`;
            x += pw + 4;
          });
          y += rh + 6;
        });
        svg += '</svg>';
        $keyboardContainer.innerHTML = svg;

          $wordGrid.innerHTML = html;
        }
        setTimeout(() => { const cur = $wordGrid.querySelector('.current'); if (cur) cur.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 50);
      }

      function renderInputSlots() { const w = currentWord(); if (!w) { $inputDisplay.innerHTML = ''; return; } let html = ''; for (let i = 0; i < w.sp.length; i++) html += `<div class="char-slot" id="slot-${i}"></div>`; $inputDisplay.innerHTML = html; }
      function updateSlot(idx, ch, status) { const slot = document.getElementById('slot-' + idx); if (!slot) return; slot.textContent = ch; slot.className = 'char-slot'; if (status === 'correct') slot.classList.add('filled-correct'); else if (status === 'incorrect') slot.classList.add('filled-incorrect'); else if (status === 'current') slot.classList.add('current-slot'); }
      function clearSlots() { const w = currentWord(); if (!w) return; for (let i = 0; i < w.sp.length; i++) { const s = document.getElementById('slot-' + i); if (s) { s.textContent = ''; s.className = 'char-slot'; } } const first = document.getElementById('slot-0'); if (first) first.classList.add('current-slot'); }
      function updateAccuracy() { const total = state.correct + state.error; $accuracy.textContent = (total === 0 ? 0 : Math.round(state.correct / total * 100)) + '%'; }

      function updateTopHeaderPadding() {
        const collapsed = document.body.classList.contains('sidebar-collapsed');
        $topHeader.style.paddingLeft = collapsed ? '100px' : '120px';
        $topHeader.style.paddingRight = collapsed ? '100px' : '120px';
      }

      function refreshUI() {
        syncWordErrorFlags();
        const ws = currentWords(), w = currentWord(), total = ws.length, isCustom = state.stageIdx >= STAGES.length;
        $stageLabel.textContent = isCustom ? '✏️ 自定义词汇' : (STAGES[state.stageIdx]?.name || '');
        const isYunmu = isYunmuStage();
        if (isYunmu) {
          state.showHint = false;
          $btnHint.disabled = true;
          $btnHint.style.opacity = '0.4';
        } else {
          $btnHint.disabled = false;
          $btnHint.style.opacity = '1';
        }
        renderWordGrid();
        renderInputSlots();
        inputBuffer = ''; clearSlots(); clearHighlight();
        if (w && w.sp.length > 0) highlightKey(w.sp[0]);
        $correctCount.textContent = state.correct; $errorCount.textContent = state.error; updateAccuracy();
        updateSpeed();
        $progressBar.style.width = total ? `${(state.wordIdx / total) * 100}%` : '0%';
        renderStageSelector(); renderCustomList(); updateVocabSelect();
        $btnPrevStage.disabled = (state.stageIdx <= 0);
        $btnNextStage.disabled = (state.stageIdx >= STAGES.length - 1);
        updateTopHeaderPadding();
        if (total && state.wordIdx >= total) {
          state.wordIdx = 0;
          state.wordErrorFlags = new Array(total).fill(false);
          refreshUI();
        }
      }

      function renderStageSelector() {
        let html = '';
        STAGES.forEach((st, i) => {
          let cls = 'stage-btn';
          if (i === state.stageIdx && state.stageIdx < STAGES.length) cls += ' active';
          if (state.completedStages.includes(st.id)) cls += ' completed';
          html += `<button class="${cls}" data-sidx="${i}">${st.name}</button>`;
        });
        let customCls = 'stage-btn';
        if (state.stageIdx >= STAGES.length) customCls += ' active';
        html += `<button class="${customCls}" data-sidx="custom">✏️ 自定义</button>`;
        $stageSelector.innerHTML = html;
        $stageSelector.querySelectorAll('.stage-btn').forEach(btn => {
          btn.addEventListener('click', function () {
            const v = this.dataset.sidx;
            if (v === 'custom') switchToCustom();
            else switchToStage(parseInt(v));
          });
        });
      }

      function switchToStage(idx) {
        if (idx < STAGES.length) {
          state.stageIdx = idx;
          const prog = state.stageProgress[STAGES[idx].id];
          state.wordIdx = prog?.wordIdx || 0;
          state.correct = prog?.correct || 0;
          state.error = prog?.error || 0;
        }
        state.startTime = Date.now();
        state.totalKeystrokes = 0;
        state.wordErrorFlags = new Array(totalWords()).fill(false);
        inputBuffer = ''; refreshUI(); saveState();
      }
      function switchToCustom() { state.stageIdx = STAGES.length; state.wordIdx = 0; state.correct = 0; state.error = 0; state.wordErrorFlags = []; state.startTime = Date.now(); state.totalKeystrokes = 0; inputBuffer = ''; refreshUI(); saveState(); }

      function handleInput(char) {
        const w = currentWord(); if (!w) return;
        const target = w.sp, idx = inputBuffer.length;
        if (idx >= target.length) return;
        const correct = (char === target[idx]);
        updateSlot(idx, char, correct ? 'correct' : 'incorrect');
        if (correct) {
          playBase64Audio(SOUND_CORRECT_BASE64);
          flashKey(char, 'correct-flash');
          state.totalKeystrokes++;
          inputBuffer += char;
          if (inputBuffer.length === target.length) {
            state.correct++; state.wordIdx++;
            saveProgress(); saveState(); inputBuffer = '';
            setTimeout(() => { refreshUI(); }, 200);
          } else { highlightKey(target[inputBuffer.length]); const nextSlot = document.getElementById('slot-' + inputBuffer.length); if (nextSlot) nextSlot.classList.add('current-slot'); }
        } else {
          playBase64Audio(SOUND_ERROR_BASE64);
          flashKey(char, 'error-flash');
          state.wordErrorFlags[state.wordIdx] = true;
          state.error++; saveProgress(); saveState();
          setTimeout(() => { inputBuffer = ''; clearSlots(); clearHighlight(); if (target.length > 0) highlightKey(target[0]); }, 300);
        }
      }

      function handleBackspace() {
        if (inputBuffer.length > 0) { inputBuffer = inputBuffer.slice(0, -1); const w = currentWord(); for (let i = 0; i < w.sp.length; i++) { const s = document.getElementById('slot-' + i); if (s) { s.textContent = ''; s.className = 'char-slot'; } } for (let i = 0; i < inputBuffer.length; i++) updateSlot(i, inputBuffer[i], 'correct'); const curSlot = document.getElementById('slot-' + inputBuffer.length); if (curSlot) curSlot.classList.add('current-slot'); if (w && inputBuffer.length < w.sp.length) highlightKey(w.sp[inputBuffer.length]); else clearHighlight(); }
      }

      function saveProgress() { if (state.stageIdx < STAGES.length) state.stageProgress[STAGES[state.stageIdx].id] = { wordIdx: state.wordIdx, correct: state.correct, error: state.error }; }

      function addCustomWordAuto(word) { if (!word.trim()) return toast('请输入词汇', 'error'); const result = autoGenerateSp(word); if (!result || !result.sp) return toast('自动生成失败', 'error'); if (state.customWords.some(w => w.w === word && w.sp === result.sp)) return toast('词汇已存在', 'info'); state.customWords.push({ w: word, sp: result.sp, py: result.py }); saveState(); renderCustomList(); toast(`已添加“${word}” → ${result.sp}`, 'success'); }
      function removeCustomWord(index) { state.customWords.splice(index, 1); saveState(); renderCustomList(); if (state.stageIdx >= STAGES.length) { if (state.customWords.length === 0) state.wordIdx = 0; else if (state.wordIdx >= state.customWords.length) state.wordIdx = 0; inputBuffer = ''; refreshUI(); } }
      function renderCustomList() { if (!state.customWords.length) { $customList.innerHTML = '<span style="color:#bbb;">暂无自定义词汇</span>'; return; } let html = ''; state.customWords.forEach((w, i) => { html += `<span class="custom-tag" title="双拼:${w.sp}">${w.w}<small>(${w.sp})</small><span class="remove-tag" data-idx="${i}">&times;</span></span>`; }); $customList.innerHTML = html; $customList.querySelectorAll('.remove-tag').forEach(btn => { btn.addEventListener('click', e => { e.stopPropagation(); removeCustomWord(parseInt(btn.dataset.idx)); }); }); }
      function batchAddWords() { const text = $batchInput.value.trim(); if (!text) return toast('请输入内容', 'error'); const hasSpace = /\s/.test(text); let units = []; if (hasSpace) { units = text.split(/\s+/).filter(u => u.length > 0); } else { units = text.split(/[，。！？；：、\n\r]+/).filter(s => s.trim().length > 0).map(s => s.trim()); } let added = 0; units.forEach(word => { const result = autoGenerateSp(word); if (result && result.sp && result.sp.length === word.length * 2 && !state.customWords.some(w => w.w === word && w.sp === result.sp)) { state.customWords.push({ w: word, sp: result.sp, py: result.py }); added++; } }); if (added === 0) return toast('没有可添加的词汇', 'info'); saveState(); renderCustomList(); $batchInput.value = ''; toast(`成功添加 ${added} 个单位`, 'success'); }
      function updateVocabSelect() { const vocabs = getSavedVocabs(); const names = Object.keys(vocabs); $vocabSelect.innerHTML = '<option value="">-- 加载词库 --</option>'; names.forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; $vocabSelect.appendChild(opt); }); }
      function saveCurrentVocab() { const name = $vocabNameInput.value.trim(); if (!name) return toast('请输入词库名称', 'error'); const vocabs = getSavedVocabs(); vocabs[name] = [...state.customWords]; saveVocabs(vocabs); updateVocabSelect(); toast(`词库“${name}”已保存`, 'success'); $vocabNameInput.value = ''; }
      function loadVocab() { const name = $vocabSelect.value; if (!name) return; const vocabs = getSavedVocabs(); if (!vocabs[name]) return toast('词库不存在', 'error'); state.customWords = [...vocabs[name]]; saveState(); renderCustomList(); if (state.stageIdx >= STAGES.length) refreshUI(); toast(`已加载词库“${name}”`, 'success'); }
      function deleteVocab() { const name = $vocabSelect.value; if (!name) return; if (!confirm(`确定删除词库“${name}”吗？`)) return; const vocabs = getSavedVocabs(); delete vocabs[name]; saveVocabs(vocabs); updateVocabSelect(); toast(`词库“${name}”已删除`, 'info'); }
      function shuffleWords() { const words = currentWords(); if (words.length < 2) return; for (let i = words.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[words[i], words[j]] = [words[j], words[i]]; } state.wordIdx = 0; state.correct = 0; state.error = 0; state.wordErrorFlags = new Array(words.length).fill(false); state.startTime = Date.now(); state.totalKeystrokes = 0; inputBuffer = ''; refreshUI(); saveState(); }
      window.jumpToWord = function (index) { const words = currentWords(); if (index < 0 || index >= words.length) return; state.wordIdx = index; inputBuffer = ''; refreshUI(); saveState(); };

      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const key = e.key;
        if (key === 'Backspace') { e.preventDefault(); handleBackspace(); return; }
        if (key === 'Escape') { e.preventDefault(); inputBuffer = ''; clearSlots(); clearHighlight(); const w = currentWord(); if (w) highlightKey(w.sp[0]); toast('已重置当前输入', 'info'); return; }
        if (key.length === 1 && /^[a-zA-Z0-9,.;/'\[\]\-=`\\]$/.test(key)) { e.preventDefault(); handleInput(key.toLowerCase()); }
      });

      $btnHint.addEventListener('click', () => { if (isYunmuStage()) return; state.showHint = !state.showHint; saveState(); refreshUI(); });
      $btnReset.addEventListener('click', () => { state.wordIdx = 0; state.correct = 0; state.error = 0; state.wordErrorFlags = new Array(totalWords()).fill(false); if (state.stageIdx < STAGES.length) saveProgress(); state.startTime = Date.now(); state.totalKeystrokes = 0; inputBuffer = ''; saveState(); refreshUI(); });
      $btnShuffle.addEventListener('click', shuffleWords);
      $btnClearCustom.addEventListener('click', () => { if (confirm('确定清除所有自定义词汇吗？')) { state.customWords = []; saveState(); renderCustomList(); if (state.stageIdx >= STAGES.length) { state.stageIdx = 0; state.wordIdx = 0; state.correct = 0; state.error = 0; } refreshUI(); } });
      $btnAddCustom.addEventListener('click', () => { addCustomWordAuto($customWordInput.value); $customWordInput.value = ''; });
      $customWordInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCustomWordAuto($customWordInput.value); $customWordInput.value = ''; } });
      $modalClose.addEventListener('click', () => { $settingsModal.classList.remove('open'); });
      $settingsModal.addEventListener('click', function (e) { if (e.target === $settingsModal) $settingsModal.classList.remove('open'); });
      $btnBatchAdd.addEventListener('click', batchAddWords);
      $btnSaveVocab.addEventListener('click', saveCurrentVocab);
      $btnLoadVocab.addEventListener('click', loadVocab);
      $btnDeleteVocab.addEventListener('click', deleteVocab);

      $btnSettings.addEventListener('click', () => { $settingsModal.classList.add('open'); });

      function toggleSidebar() {
        document.body.classList.toggle('sidebar-collapsed');
        updateTopHeaderPadding();
      }
      $titleIcon.addEventListener('click', toggleSidebar);
      $sidebarToggleFixed.addEventListener('click', toggleSidebar);

      $btnPrevStage.addEventListener('click', () => {
        if (state.stageIdx > 0) switchToStage(state.stageIdx - 1);
      });
      $btnNextStage.addEventListener('click', () => {
        if (state.stageIdx < STAGES.length - 1) switchToStage(state.stageIdx + 1);
      });

      function init() {
        loadState();
        renderKeyboard();
        renderStageSelector();
        renderCustomList();
        updateVocabSelect();
        if (!state.startTime) state.startTime = Date.now();
        if (state.totalKeystrokes === undefined) state.totalKeystrokes = 0;
        refreshUI();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
        setTimeout(() => {
          if (!document.body.classList.contains('sidebar-collapsed')) {
            document.body.classList.add('sidebar-collapsed');
            updateTopHeaderPadding();
          }
        }, 1000);
      }
      init();
    })();
  </script>
</body>
